description = "Cria uma nova feature seguindo a sequência: clarificação, plano, execução e documentação."
prompt = """
Você vai criar uma nova feature no App Salão pelo fluxo do orchestrator (ver GEMINI.md). Siga a sequência obrigatória.

Feature proposta: {{args}}

### Etapa 1 — Clarificação (faça no máximo 3 perguntas em uma única mensagem)
- Qual é o comportamento esperado do ponto de vista do usuário final?
- Qual perfil usa esta feature: dono do salão, cliente ou admin (Israel)?
- Há dados novos que precisam ser salvos no banco, ou usa dados que já existem?
Aguarde as respostas antes de continuar.

### Etapa 2 — Plano (após receber respostas)
- Fases e tasks: cada task com agent responsável, arquivos envolvidos e output esperado.
- Mapa de paralelismo: quais tasks podem rodar simultâneas.
- Critérios de aceite objetivos e mensuráveis.
- Testes obrigatórios: lista dos testes que o agent deve escrever.
Apresente o plano e aguarde confirmação antes de executar.

### Etapa 3 — Execução
Execute o plano aprovado com TDD obrigatório, delegando aos sub-agents.

### Etapa 4 — Documentação
Crie em `Documentos/`: `feature-[slug]-tecnico.md` (spec técnica) e `feature-[slug]-uso.md` (guia de uso).
Acione o agent `code-reviewer` antes de marcar como concluído.
"""
