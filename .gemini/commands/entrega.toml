description = "Executa o checklist de entrega do Sprint 1 (avalia status de cada task, sem implementar)."
prompt = """
Execute o checklist completo de entrega do Sprint 1 assumindo o papel do orchestrator (ver GEMINI.md).

Instruções:
1. Leia `Documentos/PLAN.md` e verifique o status de cada checkbox de testes críticos em todas as 8 tasks.
2. Para cada task, determine: Completa / Parcial / Pendente.
3. Produza um relatório com três seções: Completas (tasks prontas), Pendentes (o que falta e qual agent é responsável), Próximo passo (qual task priorizar e por quê, considerando dependências).
4. Se todas as 8 tasks estiverem completas e `Documentos/smoke_test_result.md` existir com todos os critérios como pass → confirme que o Sprint 1 está concluído e sugira `/deploy`.
5. Se houver pendências → liste os comandos exatos para executar (ex.: `/implementar Task 2.1`).

Não implemente nada — apenas avalie e reporte.
"""
